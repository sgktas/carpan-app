server {
    listen 80;
    listen [::]:80;
    server_name carpan.app www.carpan.app;
    return 301 https://carpan.app$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.carpan.app;
    ssl_certificate /etc/letsencrypt/live/carpan.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carpan.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://carpan.app$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name carpan.app;
    ssl_certificate /etc/letsencrypt/live/carpan.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carpan.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /opt/carpan/current/dist;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:4301/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}
